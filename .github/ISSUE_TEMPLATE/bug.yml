name: Something does not work
description: A bug, a layout problem, or something confusing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste your own journal or lens answers here. Describe what happened instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
