name: Content suggestion
description: A lens question, wording, translation, or card picture idea
labels: [content]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [換角度 lens content, Card picture, Bedtime track, Language mirror, Other]
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: Quote the current text and your proposed text. Sources (for example a chapter of Corey) help.
    validations:
      required: true
